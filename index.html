<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Daily Planner</title>
    <style>
        :root {
            --notion-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
            --bg-color: #ffffff;
            --text-color: #37352f;
            --q1-bg: #fde8e8; /* 紧急且重要 - 淡红 */
            --q2-bg: #e8f3ef; /* 不紧急但重要 - 淡绿 */
            --q3-bg: #fbf3db; /* 紧急不重要 - 淡黄 */
            --q4-bg: #f0f4f8; /* 不紧急不重要 - 淡蓝 */
            --border-color: #e9e9e7;
        }
        body {
            font-family: var(--notion-font);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-color: var(--bg-color);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .reset-btn {
            background-color: #fff;
            color: #d93025;
            border: 1px solid #d93025;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .reset-btn:hover {
            background-color: #fce8e6;
        }
        .container {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .timeline-col {
            flex: 1;
            min-width: 300px;
            background: #fff;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .matrix-col {
            flex: 2;
            min-width: 450px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .quadrant {
            padding: 16px;
            border-radius: 8px;
            min-height: 200px;
        }
        .q1 { background-color: var(--q1-bg); }
        .q2 { background-color: var(--q2-bg); }
        .q3 { background-color: var(--q3-bg); }
        .q4 { background-color: var(--q4-bg); }
        
        h3 {
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }
        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .task-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 8px;
            padding: 4px 0;
        }
        .task-item input[type="checkbox"] {
            margin-top: 4px;
            margin-right: 8px;
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #5f6368;
        }
        .task-item input[type="time"] {
            margin-right: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 2px 4px;
            font-family: inherit;
            font-size: 13px;
        }
        .task-item span {
            flex: 1;
            outline: none;
            line-height: 1.5;
            min-height: 24px;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .task-item span:focus {
            background-color: rgba(0,0,0,0.05);
        }
        .task-item span[contenteditable]:empty::before {
            content: "输入内容...";
            color: #999;
        }
        .task-item.checked span {
            text-decoration: line-through;
            color: #999;
        }
        .del-btn, .add-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .del-btn {
            opacity: 0;
            width: 24px;
            height: 24px;
            font-size: 18px;
        }
        .task-item:hover .del-btn {
            opacity: 1;
        }
        .del-btn:hover { color: #d93025; background: rgba(217, 48, 37, 0.1); }
        .add-btn {
            font-size: 20px;
            width: 28px;
            height: 28px;
        }
        .add-btn:hover {
            background-color: rgba(0,0,0,0.1);
            color: #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>今日工作规划</h2>
        <button class="reset-btn" onclick="resetData()">重置今日</button>
    </div>
    <div class="container">
        <!-- 时间轴 -->
        <div class="timeline-col">
            <h3><span>今日时间轴</span> <button class="add-btn" onclick="addTask('timeline')" title="添加任务">+</button></h3>
            <ul class="task-list" id="timeline-list"></ul>
        </div>
        
        <!-- 四象限 -->
        <div class="matrix-col">
            <div class="quadrant q1">
                <h3><span>紧急且重要</span> <button class="add-btn" onclick="addTask('q1')" title="添加任务">+</button></h3>
                <ul class="task-list" id="q1-list"></ul>
            </div>
            <div class="quadrant q3">
                <h3><span>紧急不重要</span> <button class="add-btn" onclick="addTask('q3')" title="添加任务">+</button></h3>
                <ul class="task-list" id="q3-list"></ul>
            </div>
            <div class="quadrant q2">
                <h3><span>不紧急但重要</span> <button class="add-btn" onclick="addTask('q2')" title="添加任务">+</button></h3>
                <ul class="task-list" id="q2-list"></ul>
            </div>
            <div class="quadrant q4">
                <h3><span>不紧急不重要</span> <button class="add-btn" onclick="addTask('q4')" title="添加任务">+</button></h3>
                <ul class="task-list" id="q4-list"></ul>
            </div>
        </div>
    </div>

    <script>
        const defaultData = {
            timeline: [{id: 1, text: '', checked: false, time: '09:00'}],
            q1: [{id: 2, text: '', checked: false}],
            q2: [{id: 3, text: '', checked: false}],
            q3: [{id: 4, text: '', checked: false}],
            q4: [{id: 5, text: '', checked: false}]
        };

        let data = JSON.parse(localStorage.getItem('notionPlannerData')) || defaultData;

        function saveData() {
            localStorage.setItem('notionPlannerData', JSON.stringify(data));
        }

        function render() {
            ['timeline', 'q1', 'q2', 'q3', 'q4'].forEach(listId => {
                const ul = document.getElementById(listId + '-list');
                ul.innerHTML = '';
                
                // Sort timeline by time
                if (listId === 'timeline') {
                    data[listId].sort((a, b) => (a.time || '23:59').localeCompare(b.time || '23:59'));
                }

                data[listId].forEach(task => {
                    const li = document.createElement('li');
                    li.className = 'task-item' + (task.checked ? ' checked' : '');
                    
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.checked = task.checked;
                    cb.onchange = (e) => { 
                        task.checked = e.target.checked; 
                        saveData(); 
                        render();
                    };
                    li.appendChild(cb);
                    
                    if (listId === 'timeline') {
                        const timeInput = document.createElement('input');
                        timeInput.type = 'time';
                        timeInput.value = task.time || '';
                        timeInput.onchange = (e) => { 
                            task.time = e.target.value; 
                            saveData(); 
                            render(); // Re-sort
                        };
                        li.appendChild(timeInput);
                    }
                    
                    const span = document.createElement('span');
                    span.contentEditable = true;
                    span.textContent = task.text;
                    span.onblur = (e) => { 
                        task.text = e.target.textContent; 
                        saveData(); 
                    };
                    li.appendChild(span);
                    
                    const delBtn = document.createElement('button');
                    delBtn.className = 'del-btn';
                    delBtn.innerHTML = '×';
                    delBtn.title = '删除';
                    delBtn.onclick = () => { 
                        data[listId] = data[listId].filter(t => t.id !== task.id);
                        saveData();
                        render();
                    };
                    li.appendChild(delBtn);
                    
                    ul.appendChild(li);
                });
            });
        }

        function addTask(listId) {
            data[listId].push({id: Date.now(), text: '', checked: false, time: listId === 'timeline' ? '12:00' : ''});
            saveData();
            render();
        }

        function resetData() {
            if(confirm("确定要清空所有任务，开启新的一天吗？")) {
                data = {
                    timeline: [{id: 1, text: '', checked: false, time: '09:00'}],
                    q1: [{id: 2, text: '', checked: false}],
                    q2: [{id: 3, text: '', checked: false}],
                    q3: [{id: 4, text: '', checked: false}],
                    q4: [{id: 5, text: '', checked: false}]
                };
                saveData();
                render();
            }
        }

        render();
    </script>
</body>
</html>
